name: bash-tower-easy

services:
  player01:
    build:
      context: .
      dockerfile: tower/dockerfile
      args:
        PLAYER: player01
    image: locstd-easy-player01
    container_name: locstd-easy-player01
    hostname: tower
    ports:
      - "12201:22"
    init: true
    pids_limit: 300
    mem_limit: 256m
    cpus: 1
    restart: unless-stopped

